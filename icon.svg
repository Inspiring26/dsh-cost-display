<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DeepSeek peak and off-peak cost">
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172E66"/>
      <stop offset="0.55" stop-color="#0E1E44"/>
      <stop offset="1" stop-color="#081228"/>
    </linearGradient>
    <linearGradient id="peak" x1="13" y1="12" x2="51" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD36A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(32 35) rotate(90) scale(24)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FB2FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <circle cx="32" cy="34" r="24" fill="url(#glow)"/>

  <!-- Clock ring: the off-peak (cool) portion. -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#DCE9FF" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Peak windows: Beijing 09:00-12:00 and 14:00-18:00, warm amber. -->
  <path d="M11.5 32A20.5 20.5 0 0 1 32 11.5" fill="none" stroke="url(#peak)" stroke-width="4" stroke-linecap="round"/>
  <path d="M50.2 21.7A20.5 20.5 0 0 1 32 52.5" fill="none" stroke="url(#peak)" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner face lift. -->
  <circle cx="32" cy="32" r="16.5" fill="#060E20" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Yen mark, drawn as a clock-hand-like glyph. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.5 22.5 32 32.5 40.5 22.5"/>
    <path d="M32 32.5V43.5"/>
    <path d="M25.5 34.5H38.5"/>
    <path d="M25.5 39.5H38.5"/>
  </g>
</svg>
